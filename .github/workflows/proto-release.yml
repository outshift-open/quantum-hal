name: proto-release

on:
  push:
    branches:
      - main
    paths:
      - "proto/**"
      - "buf.gen.yaml"
      - "scripts/add-license-headers.sh"

permissions:
  contents: write

jobs:
  generate-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Python plugins
        run: pip install grpcio-tools mypy-protobuf

      - name: Generate Go SDK
        run: |
          buf generate proto
          ./scripts/add-license-headers.sh sdk/go

      - name: Generate Python SDK
        run: |
          mkdir -p sdk/python
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=sdk/python \
            --grpc_python_out=sdk/python \
            --pyi_out=sdk/python \
            $(find proto -name '*.proto')
          find sdk/python -type d -not -path 'sdk/python' -exec sh -c 'test -f "$1/__init__.py" || touch "$1/__init__.py"' _ {} \;
          ./scripts/add-license-headers.sh sdk/python

      - name: Compute next version
        id: version
        run: |
          last_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          last_tag=${last_tag:-v0.0.0}
          IFS='.' read -r major minor patch <<<"${last_tag#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "version=${next}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into sdk/python/pyproject.toml
        run: |
          version="${{ steps.version.outputs.version }}"
          sed -i "s/^version = \".*\"/version = \"${version#v}\"/" sdk/python/pyproject.toml

      - name: Commit generated SDKs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sdk/go sdk/python
          if git diff --cached --quiet; then
            echo "No SDK changes to commit."
          else
            git commit -m "chore(sdk): regenerate Go/Python SDKs for ${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Tag release
        run: |
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"
