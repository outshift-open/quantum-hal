name: license-headers

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check license headers
        run: ./scripts/check-license-headers.sh
