name: proto-ci

on:
  pull_request:
    paths:
      - "proto/**"
      - "buf.gen.yaml"
      - "scripts/add-license-headers.sh"
      - "Makefile"
      - ".github/workflows/proto-ci.yml"

jobs:
  lint-and-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-setup-action@v1

      - name: buf lint
        run: buf lint proto

      - name: buf breaking (against main)
        run: buf breaking proto --against ".git#branch=origin/main,subdir=proto"

  generate-check:
    runs-on: ubuntu-latest
    needs: lint-and-breaking
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Python plugins
        run: pip install grpcio-tools mypy-protobuf

      - name: Generate Go SDK
        run: |
          buf generate proto
          ./scripts/add-license-headers.sh sdk/go

      - name: Generate Python SDK
        run: |
          mkdir -p sdk/python
          python -m grpc_tools.protoc \
            -I proto \
            --python_out=sdk/python \
            --grpc_python_out=sdk/python \
            --pyi_out=sdk/python \
            $(find proto -name '*.proto')
          find sdk/python -type d -not -path 'sdk/python' -exec sh -c 'test -f "$1/__init__.py" || touch "$1/__init__.py"' _ {} \;
          ./scripts/add-license-headers.sh sdk/python

      - name: Fail if generated SDKs are out of date
        run: |
          git diff --exit-code -- sdk/go sdk/python || \
            (echo "::error::Generated SDKs are out of date. Run 'make generate' locally and commit the result." && exit 1)
