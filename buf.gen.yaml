version: v1

# Managed mode injects go_package at generation time instead of it being
# hardcoded in the .proto files (deliberately omitted from the shared spec
# -- see README.md).
managed:
  enabled: true
  go_package_prefix:
    default: github.com/outshift-open/quantum-hal/sdk/go

plugins:
  - plugin: go
    out: sdk/go
    opt: paths=source_relative
  - plugin: go-grpc
    out: sdk/go
    opt: paths=source_relative

# Python message classes and gRPC stubs are generated separately via
# grpc_tools.protoc, not through buf -- see `make generate-python` /
# scripts/generate-python.sh. buf's built-in `python` plugin output isn't
# paired with a local (non-BSR) gRPC-Python plugin, and grpc_tools.protoc
# produces both the message classes and the service stubs in one shot, so
# it's simpler to generate Python entirely outside of buf.
